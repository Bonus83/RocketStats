<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RocketStats Desktop</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">ROCKET LEAGUE · DESKTOP COMPANION</p>
        <h1>RocketStats</h1>
        <p id="build-info" class="build-info"></p>
      </div>
      <div class="topbar-actions">
        <div class="connection">
          <span id="status-dot" class="status-dot"></span>
          <span id="connection-label">Connecting to local Stats API…</span>
        </div>
        <button id="config-open" class="menu-toggle config-toggle" type="button" aria-label="Configuration"
          aria-haspopup="dialog" aria-controls="config-dialog">
          <span aria-hidden="true">&#9881;</span>
        </button>
        <details id="app-menu" class="app-menu">
          <summary id="menu-toggle" class="menu-toggle" aria-label="Menu" aria-controls="menu-panel">
            <span aria-hidden="true">&#9776;</span>
          </summary>
          <div id="menu-panel" class="menu-panel">
            <div class="menu-heading">
              <strong id="menu-updates-heading">Application updates</strong>
              <span id="menu-update-version"></span>
            </div>
            <button id="update-check" class="button secondary" type="button" disabled>Check for updates</button>
            <button id="update-show" class="button secondary" type="button">Show update status</button>
            <label class="update-auto">
              <input id="update-auto" type="checkbox" checked disabled>
              <span id="update-auto-label">Automatically check for updates</span>
            </label>
            <p id="update-source" class="update-detail"></p>
            <p id="update-network" class="update-detail"></p>
          </div>
        </details>
      </div>
    </header>

    <aside id="update-balloon" class="update-balloon" aria-labelledby="updates-heading" hidden>
      <div class="update-heading">
        <div>
          <h2 id="updates-heading">Application updates</h2>
          <span id="update-version"></span>
        </div>
        <button id="update-close" class="update-close" type="button" aria-label="Close update notification">&times;</button>
      </div>
      <p id="update-status" role="status" aria-live="polite"></p>
      <progress id="update-progress" max="100" value="0" hidden aria-label="Update download"></progress>
      <p id="update-error" class="update-error" role="alert" hidden></p>
      <div class="update-actions">
        <button id="update-download" class="button secondary" type="button" hidden>Download</button>
        <button id="update-install" class="button secondary" type="button" hidden>Install and restart</button>
      </div>
    </aside>

    <main>
      <section id="error-panel" class="error-panel" hidden aria-live="polite">
        <strong id="error-title">Setup notice</strong>
        <p id="error-text"></p>
      </section>
      <section id="success-panel" class="success-panel" hidden aria-live="polite"></section>

      <section id="session-panel" class="session-panel" hidden aria-live="polite">
        <p id="session-text">Continue the previous session or start a new one?</p>
        <div class="session-actions">
          <button id="session-new" class="button secondary" type="button">Start new session</button>
          <button id="session-continue" class="button secondary" type="button">Continue session</button>
        </div>
      </section>

      <details id="accounts-panel" class="accounts-panel">
        <summary class="accounts-summary">
          <div class="accounts-heading">
            <div>
              <h2 id="accounts-heading">Accounts and candidates</h2>
            </div>
            <p id="accounts-status" role="status" aria-live="polite"></p>
          </div>
        </summary>
        <div class="accounts-content">
          <p id="accounts-hint" class="accounts-hint"></p>
          <div class="accounts-actions">
            <label for="accounts-select" id="accounts-select-label">Observed accounts</label>
            <select id="accounts-select" disabled></select>
            <button id="accounts-use" class="button secondary" type="button" disabled>Use account</button>
            <button id="accounts-correct" class="button secondary" type="button" hidden>Correct automatic attribution</button>
            <button id="accounts-remove" class="button secondary" type="button" disabled>Remove</button>
          </div>
          <form id="accounts-add-form" class="accounts-actions">
            <label for="accounts-add-input" id="accounts-add-label">Add platform ID</label>
            <input id="accounts-add-input" type="text" maxlength="160" placeholder="Steam|ID|0" autocomplete="off">
            <button id="accounts-add" class="button secondary" type="submit" disabled>Add</button>
          </form>
        </div>
      </details>

      <section class="controls" aria-label="Dashboard controls">
        <div class="scope-control">
          <div>
            <p class="eyebrow" id="scope-eyebrow">STATISTICS</p>
            <strong id="scope-value">All modes</strong>
          </div>
          <button id="scope-button" class="button secondary" type="button">Switch scope</button>
        </div>
        <div class="setting-control">
          <label for="period-select" id="period-label">Period</label>
          <select id="period-select"></select>
        </div>
        <button id="new-session-button" class="button secondary" type="button">New session</button>
        <button id="reset-button" class="button danger" type="button">Reset W/L</button>
      </section>

      <section class="dashboard-section">
        <div class="section-heading compact-heading">
          <div>
            <h2 id="ranked-heading">Rank &amp; record</h2>
          </div>
        </div>
        <div id="ranked-grid" class="card-grid"></div>
      </section>

      <section class="dashboard-section">
        <div class="section-heading compact-heading">
          <div>
            <h2 id="history-heading">MMR history</h2>
          </div>
          <label class="history-mode">
            <span id="history-mode-label">Mode</span>
            <select id="history-select"></select>
          </label>
        </div>
        <div class="history-panel">
          <div id="history-legend" class="history-legend" hidden>
            <span class="history-legend-key" aria-hidden="true"></span>
            <span id="history-legend-label"></span>
          </div>
          <svg id="history-chart" class="history-chart" viewBox="0 0 640 240" role="img"></svg>
          <div id="history-tooltip" class="history-tooltip" role="tooltip" hidden></div>
          <p id="history-summary" class="history-summary"></p>
          <p id="history-empty" class="empty-state" hidden></p>
        </div>
      </section>
    </main>

    <dialog id="config-dialog" class="configuration-dialog" aria-labelledby="config-heading">
      <div class="configuration-header">
        <h2 id="config-heading">Configuration</h2>
        <button id="config-close" class="button secondary" type="button">Close</button>
      </div>
      <div class="configuration-fields">
        <div class="setting-control">
          <label for="locale-select" id="language-label">Language</label>
          <select id="locale-select">
            <option value="de">Deutsch</option>
            <option value="en">English</option>
            <option value="pl">Polski</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="pt">Português</option>
            <option value="ru">Русский</option>
          </select>
        </div>
        <form id="port-form" class="setting-control">
          <label for="port-input" id="port-label">Local API port</label>
          <input id="port-input" type="number" min="1" max="65535" value="49123" inputmode="numeric">
          <button class="button secondary compact" id="port-save" type="submit">Apply</button>
        </form>
        <button id="setup-api-button" class="button secondary" type="button">Set up local Stats API</button>
        <p id="config-status" class="configuration-status" role="status" aria-live="polite"></p>
      </div>
    </dialog>
    <script src="./renderer.js"></script>
  </body>
</html>
